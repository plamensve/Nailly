name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and matching tests
        run: npm run check

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate public Expo config
        run: npx expo config --type public
